<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>九九道場</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="九九道場">
<meta name="theme-color" content="#3b2a1a">
<meta name="description" content="九九を道場で修行する練習アプリ。URLを開くだけ・記録はこの端末だけ。">
<script src="images.js"></script>

<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800;900&family=Yuji+Boku&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {
  --wood: #7a4a22; --wood-d: #4e2c10; --wood-l: #a8692f;
  --paper: #fffaf0; --paper-d: #f3e6c8; --ink: #2b1a0e;
  --red: #c8102e; --gold: #e8b923; --green: #2e9e5b; --blue: #2a6fc9;
  --brush: 'Yuji Boku', 'M PLUS Rounded 1c', serif;
}
html, body { width: 100%; height: 100%; background: #2b1a0e; }
body { font-family: 'M PLUS Rounded 1c', sans-serif; color: var(--ink); overflow: hidden; user-select: none; -webkit-user-select: none; }
button { font-family: inherit; cursor: pointer; border: none; color: inherit; }

/* 画面 */
.screen { display: none; position: fixed; inset: 0; background-color: #3a2614; background-size: cover; background-position: center; overflow-y: auto; overflow-x: hidden; }
.screen.active { display: block; animation: fadeIn .35s ease; }
.screen .veil { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 40%, rgba(0,0,0,.35) 100%); }
.wrap { position: relative; max-width: 980px; margin: 0 auto; padding: 16px 16px 40px; min-height: 100%; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* 読みこみ */
#loading { display: none; background: radial-gradient(circle at 50% 40%, #5a3a1c, #1e1208); align-items: center; justify-content: center; flex-direction: column; gap: 18px; color: #fff; }
#loading.active { display: flex; }
#loading .mon { font-family: var(--brush); font-size: clamp(54px, 12vw, 110px); color: #fff; text-shadow: 0 0 20px rgba(255,200,80,.6), 3px 3px 0 #000; }
#loading .msg { font-size: 20px; font-weight: 800; letter-spacing: .1em; }
.spin-dots span { display: inline-block; width: 14px; height: 14px; margin: 0 5px; border-radius: 50%; background: var(--gold); animation: dot 1s infinite ease-in-out; }
.spin-dots span:nth-child(2) { animation-delay: .15s; } .spin-dots span:nth-child(3) { animation-delay: .3s; }
@keyframes dot { 0%, 100% { transform: translateY(0); opacity: .4; } 50% { transform: translateY(-12px); opacity: 1; } }

/* トップ */
#home { background-color: #f6c58a; }
#home .home-in { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 7vh; gap: 14px; }
.home-art, .home-dim { display: none; }
.home-chars { position: fixed; left: 0; right: 0; bottom: 2vh; height: 34vh; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 2vw; pointer-events: none; }
.home-chars img { height: 100%; filter: drop-shadow(0 8px 10px rgba(0,0,0,.5)); animation: bob 3s ease-in-out infinite; }
.home-chars #hc2 { display: none; }
.home-chars #hc3 { animation-delay: 1.2s; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
@media (max-aspect-ratio: 5/6) {
  .home-dim { display: block; position: fixed; inset: 0; background: rgba(40,20,5,.55); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
  .home-chars { top: calc(10vh + 56.25vw + 3vh); bottom: auto; height: auto; max-height: 36vh; justify-content: center; gap: 2vw; }
  .home-chars img { height: auto; width: 30vw; max-height: calc(87vh - 56.25vw - 190px); object-fit: contain; }
  .home-chars #hc2 { display: block; }
  .home-art { display: block; position: fixed; left: 0; right: 0; top: 10vh; aspect-ratio: 16 / 9; background-size: cover; background-position: center; border-top: 4px solid #ffd76a; border-bottom: 4px solid #ffd76a; box-shadow: 0 10px 30px rgba(0,0,0,.6); }
}
.dojo-spec { font-size: 14px; color: #fff; margin-top: 2px; }
.spec-bar { background: rgba(43,26,14,.85); color: #ffe9b0; font-weight: 900; font-size: 16px; border: 2px solid #ffd76a; border-radius: 12px; padding: 8px 14px; margin-bottom: 12px; }
.rec-tag { position: absolute; top: -10px; left: 10px; z-index: 3; background: linear-gradient(180deg, #ffe37a, #e8a31a); color: #5a2a00; font-size: 13px; font-weight: 900; padding: 2px 10px; border-radius: 99px; border: 2px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.4); white-space: nowrap; }
.m-card.rec, .dan-btn.rec, .course-btn.rec { box-shadow: 0 0 0 4px #ffd84a, 0 0 22px rgba(255,200,40,.9), 0 6px 0 rgba(0,0,0,.35); overflow: visible; }
.m-card.shut { filter: grayscale(1) brightness(.7); opacity: .6; }
.digit { display: inline-block; width: 34px; height: 44px; border-bottom: 4px solid var(--wood); font-size: 32px; font-weight: 900; text-align: center; line-height: 44px; }
.digit.sm { width: clamp(16px, 5vw, 24px); font-size: clamp(20px, 6vw, 28px); }
.pin-dots.long { gap: 2px; }
.pin-dots i.gap { width: 8px; border: 0; }
.fk-code { display: flex; justify-content: center; flex-wrap: wrap; gap: 4px clamp(10px, 3vw, 22px); margin: 14px 0; padding: 12px 6px; background: #fff8e6; border: 3px solid var(--wood); border-radius: 12px; }
.fk-code span { font-size: clamp(26px, 7vw, 40px); font-weight: 900; letter-spacing: .08em; font-variant-numeric: tabular-nums; white-space: nowrap; }
@media (max-width: 480px) { .fk-code { display: grid; grid-template-columns: auto auto; justify-content: center; } }
.pin-dots.free { flex-wrap: wrap; gap: 2px 10px; min-height: 48px; align-items: baseline; padding: 0 4px; }
.fk-in { font-size: clamp(22px, 6vw, 30px); font-weight: 900; letter-spacing: .06em; font-variant-numeric: tabular-nums; border-bottom: 3px solid var(--wood); }
.fk-in.cur { border: 0; color: var(--wood); }
.fk-count { width: 100%; text-align: center; font-size: 14px; font-weight: 800; color: #7a5a2a; }
.fk-len { text-align: center; font-weight: 800; margin: -6px 0 8px; }
.c-fk { background: linear-gradient(135deg, #c9a227, #7a5a0c); }
.fk-home { font-size: 15px; }
.web-annai { position: relative; width: min(520px, calc(100vw - 32px)); box-sizing: border-box; background: #fff4e6; border: 3px solid #e07a2f; border-radius: 14px; padding: 12px 14px 10px; box-shadow: 0 4px 12px rgba(0,0,0,.35); color: #3a2410; }
.web-annai .wa-t { font-weight: 900; font-size: 18px; margin: 0 26px 4px 0; }
.web-annai .wa-d { font-size: 15px; line-height: 1.5; }
.web-annai .wa-btns { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 10px 0 6px; }
.web-annai .wa-go { display: inline-block; background: #e07a2f; color: #fff; font-weight: 900; font-size: 16px; padding: 9px 16px; border-radius: 12px; text-decoration: none; box-shadow: 0 3px 8px rgba(0,0,0,.3); }
.web-annai .wa-s { font-size: 13px; line-height: 1.45; color: #6b4a2a; }
.web-annai .wa-x { position: absolute; right: 6px; top: 4px; border: 0; background: none; font-size: 22px; font-weight: 900; color: #8a5a2a; width: 36px; height: 36px; }

.t-big { display: block; width: 100%; text-align: left; background: linear-gradient(180deg, #fff, #f3e6c8); border: 3px solid var(--wood); border-radius: 14px; padding: 12px 14px; font-size: 20px; font-weight: 900; margin-top: 10px; box-shadow: 0 4px 0 var(--wood-d); }
.t-big span { display: block; font-size: 14px; color: #6b4a2a; margin-top: 2px; }
.t-big:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--wood-d); }
.t-mode { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.t-mode label { display: block; background: #fff; border: 2px solid #e6d6b4; border-radius: 10px; padding: 8px; font-size: 16px; }
.t-mode label span { display: block; font-size: 12px; font-weight: 800; color: #6b4a2a; }
.t-mode input { width: 18px; height: 18px; vertical-align: middle; margin-right: 4px; }
.t-check.wide { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.share { background: #fff8e1; border: 3px double #b0761e; border-radius: 14px; padding: 12px; text-align: center; }
.share-code span { display: block; font-size: 14px; font-weight: 800; color: #6b4a2a; }
.share-code b { font-size: 46px; letter-spacing: .12em; color: var(--red); }
.share-qr { width: 180px; height: 180px; margin: 6px auto; background: #fff; }
.share-qr svg { width: 100%; height: 100%; }
.share-link { display: flex; gap: 6px; margin-top: 6px; }
.share-link input { flex: 1; min-width: 0; font-size: 13px; padding: 6px; border: 2px solid #c9a76a; border-radius: 8px; font-family: inherit; }
.admin-link { display: block; margin: 10px auto 0; background: none; color: #a08a6a; font-size: 12px; text-decoration: underline; }
#home .dojo-name { background: rgba(43,26,14,.75); color: #ffe9b0; padding: 6px 18px; border-radius: 999px; font-weight: 800; font-size: 18px; }
.big-btn { position: relative; background: linear-gradient(180deg, #d8322f, #9c0f13); color: #fff; font-size: clamp(26px, 5vw, 36px); font-weight: 900; padding: 16px 56px; border-radius: 18px; border: 4px solid #ffd76a; box-shadow: 0 7px 0 #5e070a, 0 12px 24px rgba(0,0,0,.45); text-shadow: 2px 2px 0 rgba(0,0,0,.35); letter-spacing: .15em; animation: pulse 2.2s infinite; }
.big-btn:active { transform: translateY(5px); box-shadow: 0 2px 0 #5e070a; }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
.corner { position: fixed; z-index: 50; }
.chip-btn { background: rgba(255,250,240,.92); border: 2px solid var(--wood); border-radius: 12px; padding: 8px 14px; font-weight: 800; font-size: 16px; box-shadow: 0 3px 8px rgba(0,0,0,.3); }
.chip-btn:active { transform: translateY(2px); }

/* 木の札・和紙のパネル */
.panel { background: var(--paper); border: 4px solid var(--wood); border-radius: 18px; box-shadow: 0 0 0 4px var(--paper-d) inset, 0 10px 30px rgba(0,0,0,.45); padding: 18px; }
.plaque { display: inline-block; font-family: var(--brush); font-size: clamp(26px, 5vw, 38px); color: #fff; background: linear-gradient(180deg, var(--wood-l), var(--wood) 60%, var(--wood-d)); padding: 6px 26px 8px; border-radius: 10px; border: 3px solid #2e1a08; box-shadow: 0 5px 0 #2e1a08, 0 8px 18px rgba(0,0,0,.4); text-shadow: 2px 2px 0 #2e1a08; letter-spacing: .08em; }
.head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.back { background: rgba(43,26,14,.85); color: #fff; border: 2px solid #ffd76a; border-radius: 12px; padding: 8px 16px; font-size: 17px; font-weight: 800; }

/* 師範と吹き出し */
.sensei { display: flex; align-items: flex-end; gap: 10px; }
.sensei img { width: clamp(90px, 18vw, 150px); filter: drop-shadow(0 6px 8px rgba(0,0,0,.4)); }
.bubble { position: relative; background: #fff; border: 3px solid var(--ink); border-radius: 18px; padding: 10px 16px; font-weight: 800; font-size: clamp(16px, 2.6vw, 20px); line-height: 1.5; max-width: 420px; box-shadow: 0 4px 0 rgba(0,0,0,.2); }
.bubble:before { content: ''; position: absolute; left: -16px; bottom: 18px; border: 9px solid transparent; border-right: 12px solid var(--ink); }
.bubble:after { content: ''; position: absolute; left: -10px; bottom: 20px; border: 7px solid transparent; border-right: 9px solid #fff; }
.bubble.pop { animation: pop .3s ease; }
@keyframes pop { 0% { transform: scale(.85); } 70% { transform: scale(1.05); } 100% { transform: scale(1); } }

/* メニュー */
.menu-top { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: end; margin-bottom: 14px; }
.belt-card { display: flex; align-items: center; gap: 12px; background: rgba(255,250,240,.95); border: 3px solid var(--wood); border-radius: 16px; padding: 8px 14px 8px 8px; box-shadow: 0 6px 16px rgba(0,0,0,.35); }
.belt-card img { width: 74px; }
.belt-name { font-family: var(--brush); font-size: 26px; }
.belt-bar { height: 12px; background: #e6d6b4; border-radius: 99px; overflow: hidden; margin-top: 4px; width: 160px; }
.belt-bar i { display: block; height: 100%; background: linear-gradient(90deg, #f7c843, #e88b1a); }
.belt-next { font-size: 13px; font-weight: 800; color: #6b4a2a; margin-top: 3px; }
.belt-chip { display: inline-block; width: 46px; height: 14px; border-radius: 4px; border: 2px solid rgba(0,0,0,.35); vertical-align: middle; position: relative; }
.belt-chip:after { content: ''; position: absolute; left: 50%; top: -4px; width: 10px; height: 18px; margin-left: -5px; background: inherit; border: 2px solid rgba(0,0,0,.35); border-radius: 3px; }
.menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
.m-card { position: relative; overflow: hidden; text-align: left; border-radius: 18px; padding: 16px 16px 14px; min-height: 120px; color: #fff; border: 3px solid rgba(255,255,255,.7); box-shadow: 0 6px 0 rgba(0,0,0,.35), 0 10px 20px rgba(0,0,0,.35); transition: transform .15s; }
.m-card:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.35); }
.m-card .t { font-size: 24px; font-weight: 900; text-shadow: 2px 2px 0 rgba(0,0,0,.35); }
.m-card .t, .m-card .d { position: relative; z-index: 1; padding-right: 74px; }
.m-card .d { font-size: 15px; font-weight: 800; opacity: .95; margin-top: 4px; line-height: 1.45; text-shadow: 1px 1px 0 rgba(0,0,0,.35); }
.m-card .ic { position: absolute; right: 8px; bottom: 4px; font-size: 54px; opacity: .9; }
.m-card img.ic { width: 92px; right: 2px; bottom: 0; }
.c-single { background: linear-gradient(135deg, #d8322f, #8f0d12); }
.c-duel { background: linear-gradient(135deg, #2a6fc9, #173e7a); }
.c-kumite { background: linear-gradient(135deg, #f08bb0, #c2416f); }
.c-boss { background: linear-gradient(135deg, #5a3aa8, #24124f); }
.c-nigate { background: linear-gradient(135deg, #e88b1a, #a8560a); }
.c-table { background: linear-gradient(135deg, #2e9e5b, #145c32); }
.c-shelf { background: linear-gradient(135deg, #8b5a2b, #4e2c10); }
.new-tag { position: absolute; top: 8px; right: 10px; background: #fff; color: var(--red); font-size: 13px; font-weight: 900; padding: 2px 8px; border-radius: 99px; }
.fuda-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.fuda { background: #fff8e6; color: var(--ink); border: 2px solid #b0761e; border-radius: 6px; padding: 2px 6px; font-size: 14px; font-weight: 900; }

/* 段えらび */
.dan-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.dan-btn { position: relative; background: linear-gradient(180deg, var(--wood-l), var(--wood) 55%, var(--wood-d)); color: #fff; border: 3px solid #2e1a08; border-radius: 16px; padding: 14px 8px 12px; box-shadow: 0 6px 0 #2e1a08, 0 10px 16px rgba(0,0,0,.35); min-height: 112px; }
.dan-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #2e1a08; }
.dan-btn .n { font-family: var(--brush); font-size: 40px; line-height: 1.1; text-shadow: 2px 2px 0 #2e1a08; }
.dan-btn .sub { font-size: 13px; font-weight: 800; color: #ffe9b0; margin-top: 4px; }
.dan-btn.all { background: linear-gradient(180deg, #e8b923, #b8860b 60%, #7a5806); }
.dan-btn.locked { filter: grayscale(1) brightness(.6); pointer-events: none; }
.dan-btn img.boss-face { width: 64px; display: block; margin: 0 auto 2px; filter: drop-shadow(0 3px 3px rgba(0,0,0,.4)); }
.dan-btn.beaten img.boss-face { filter: drop-shadow(0 3px 3px rgba(0,0,0,.4)) grayscale(.2); }
.stamps { display: flex; justify-content: center; gap: 4px; margin-top: 6px; }
.stamp { width: 20px; height: 20px; border-radius: 50%; border: 2px dashed rgba(255,233,176,.55); font-size: 11px; line-height: 16px; font-weight: 900; color: transparent; }
.stamp.on { border: 2px solid #fff; background: var(--red); color: #fff; transform: rotate(-12deg); box-shadow: 0 0 0 2px var(--red); }
.lock-msg { margin-top: 10px; font-weight: 800; color: #fff; text-shadow: 1px 1px 0 #000; }

/* コースえらび */
.course-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.course-btn { position: relative; text-align: left; background: var(--paper); border: 3px solid var(--wood); border-radius: 16px; padding: 14px; box-shadow: 0 6px 0 var(--wood-d), 0 10px 16px rgba(0,0,0,.3); }
.course-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--wood-d); }
.course-btn .t { font-size: 22px; font-weight: 900; }
.course-btn .d { font-size: 15px; font-weight: 800; color: #6b4a2a; margin-top: 4px; }
.course-btn .r { font-size: 14px; font-weight: 800; color: var(--red); margin-top: 6px; }
.course-btn .ic { position: absolute; right: 12px; top: 10px; font-size: 30px; }
.course-btn.gold { background: linear-gradient(180deg, #fff6d6, #ffe7a0); }
.course-btn.off { opacity: .45; pointer-events: none; }
.maki { display: inline-block; width: 30px; height: 16px; border-radius: 4px; background: linear-gradient(180deg, #fff3c4, #e8c56b); border: 2px solid #8b5a2b; position: relative; vertical-align: middle; }
.maki:before, .maki:after { content: ''; position: absolute; top: -4px; width: 6px; height: 20px; background: #6b3a12; border-radius: 3px; }
.maki:before { left: -5px; } .maki:after { right: -5px; }
.maki.on { background: linear-gradient(180deg, #ffe37a, #e8a31a); box-shadow: 0 0 10px rgba(255,200,40,.9); }
.maki.on i { position: absolute; left: 50%; top: 2px; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%; background: var(--red); }
.maki.off { filter: grayscale(1); opacity: .35; }

/* 修行の画面 */
.play-wrap { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; padding: 10px 12px 14px; }
.play-bar { width: 100%; max-width: 900px; display: flex; align-items: center; gap: 10px; }
.quit { background: rgba(43,26,14,.85); color: #fff; border: 2px solid #ffd76a; border-radius: 12px; padding: 6px 14px; font-weight: 800; font-size: 16px; }
.timer { background: rgba(255,250,240,.95); border: 3px solid var(--wood); border-radius: 12px; padding: 4px 12px; font-weight: 900; font-size: 22px; min-width: 110px; text-align: center; }
.timer.hurry { color: #fff; background: var(--red); animation: pulse .6s infinite; }
.prog { flex: 1; height: 18px; background: rgba(0,0,0,.35); border-radius: 99px; overflow: hidden; border: 2px solid rgba(255,255,255,.6); }
.prog i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #ffd84a, #ff8a1a); transition: width .3s; }
.prog-t { color: #fff; font-weight: 900; text-shadow: 1px 1px 0 #000; font-size: 16px; white-space: nowrap; }
.stage { width: 100%; max-width: 900px; display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; margin: 16px 0 6px; min-height: 110px; }
.stage .sensei img { width: clamp(80px, 15vw, 130px); }
.stage .bubble { font-size: clamp(14px, 2.4vw, 18px); }
.combo { font-weight: 900; color: #fff; font-size: clamp(22px, 4vw, 34px); text-shadow: 0 0 10px #ff6a00, 2px 2px 0 #7a1c00; white-space: nowrap; }
.combo.hot { animation: flame .5s infinite alternate; }
@keyframes flame { from { text-shadow: 0 0 10px #ff6a00, 2px 2px 0 #7a1c00; } to { text-shadow: 0 0 26px #ffb300, 0 0 6px #ff3d00, 2px 2px 0 #7a1c00; } }
.qbox { position: relative; width: 100%; max-width: 620px; background: var(--paper); border: 5px solid var(--wood); border-radius: 22px; box-shadow: 0 0 0 5px var(--paper-d) inset, 0 12px 26px rgba(0,0,0,.45); padding: 10px 14px; text-align: center; }
.qlabel { font-size: 15px; font-weight: 800; color: #6b4a2a; min-height: 20px; }
.qtext { font-size: clamp(42px, 9vw, 76px); font-weight: 900; letter-spacing: .04em; line-height: 1.15; }
.qtext .hole { display: inline-block; min-width: 1.1em; border: 4px dashed var(--red); border-radius: 10px; color: var(--red); line-height: 1; padding: 0 .1em; }
.qtext.zoom { animation: zoom .35s ease; }
@keyframes zoom { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.qbox.shake { animation: shake .4s; }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-10px); } 40% { transform: translateX(10px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(6px); } }
.choices { width: 100%; max-width: 620px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
.choice { background: linear-gradient(180deg, #fff, #f2e3c2); border: 3px solid var(--wood); border-radius: 16px; font-size: clamp(26px, 5.5vw, 40px); font-weight: 900; padding: 10px 4px; box-shadow: 0 6px 0 var(--wood-d); }
.choice.small { font-size: clamp(20px, 4.4vw, 30px); }
.choice:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--wood-d); }
.choice.ok { background: linear-gradient(180deg, #7ee2a2, #2e9e5b); color: #fff; border-color: #145c32; animation: pop .3s; }
.choice.ng { background: linear-gradient(180deg, #ff8f8f, #c8102e); color: #fff; border-color: #7a0010; animation: shake .4s; }
.choice.hint { box-shadow: 0 0 0 4px #ffd84a, 0 6px 0 var(--wood-d); }
.choice.gone { visibility: hidden; }
.choices.lock .choice { pointer-events: none; }

/* 板わり（正解の板が真ん中から割れて飛ぶ） */
.brk { position: fixed; z-index: 70; pointer-events: none; animation: brkHit .12s ease-out; }
.brk-h { position: absolute; inset: 0; }
.brk-h .brk-c { width: 100%; height: 100%; margin: 0; animation: none; box-sizing: border-box; }
.brk-h.l { clip-path: polygon(0 0, 54% 0, 45% 28%, 57% 52%, 44% 76%, 53% 100%, 0 100%); animation: brkL .6s .09s cubic-bezier(.2,.7,.4,1) forwards; }
.brk-h.r { clip-path: polygon(54% 0, 100% 0, 100% 100%, 53% 100%, 44% 76%, 57% 52%, 45% 28%); animation: brkR .6s .09s cubic-bezier(.2,.7,.4,1) forwards; }
@keyframes brkHit { 0% { transform: scale(1); } 50% { transform: scale(1.1) translateY(4px); } 100% { transform: scale(1); } }
@keyframes brkL { 0% { transform: translate(0, 0) rotate(0); opacity: 1; } 100% { transform: translate(-46px, 70px) rotate(-28deg); opacity: 0; } }
@keyframes brkR { 0% { transform: translate(0, 0) rotate(0); opacity: 1; } 100% { transform: translate(46px, 70px) rotate(28deg); opacity: 0; } }
.brk-burst { position: absolute; left: 50%; top: 50%; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%; background: radial-gradient(circle, #fff 0%, rgba(255,240,170,.9) 35%, rgba(255,200,60,0) 70%); animation: brkBurst .35s ease-out forwards; }
@keyframes brkBurst { from { transform: scale(.3); opacity: 1; } to { transform: scale(4.5); opacity: 0; } }
.brk-chip { position: absolute; left: 50%; top: 50%; width: 9px; height: 5px; background: #a8743a; border-radius: 1px; animation: brkChip .55s .05s ease-out forwards; }
@keyframes brkChip { to { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity: 0; } }
.keypad { width: 100%; max-width: 420px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
.key { background: linear-gradient(180deg, #fff, #f2e3c2); border: 3px solid var(--wood); border-radius: 50%; aspect-ratio: 1.5 / 1; border-radius: 18px; font-size: 34px; font-weight: 900; box-shadow: 0 5px 0 var(--wood-d); }
.key:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--wood-d); }
.key.go { background: linear-gradient(180deg, #ff6d5a, #c8102e); color: #fff; font-size: 24px; }
.key.del { font-size: 26px; }
.keypad.lock .key { pointer-events: none; opacity: .6; }
.boss-zone { display: flex; flex-direction: column; align-items: center; }
.boss-zone img { width: auto; height: clamp(90px, 22vh, 200px); max-width: 40vw; object-fit: contain; filter: drop-shadow(0 8px 10px rgba(0,0,0,.6)); transition: transform .15s; }
.boss-zone img.hit { animation: hit .4s; }
@keyframes hit { 0% { transform: translateX(0); filter: brightness(3); } 30% { transform: translateX(14px) rotate(6deg); } 60% { transform: translateX(-8px); } 100% { transform: translateX(0); } }
.boss-zone img.down { transform: rotate(80deg) translateY(30px); opacity: .5; transition: all .8s; }
.boss-name { color: #fff; font-weight: 900; text-shadow: 2px 2px 0 #000; font-size: 18px; }
.hp { width: clamp(140px, 24vw, 220px); height: 18px; background: rgba(0,0,0,.5); border: 2px solid #fff; border-radius: 99px; overflow: hidden; margin-top: 4px; }
.hp i { display: block; height: 100%; background: linear-gradient(90deg, #ff3d3d, #ffb300); transition: width .3s; }
.hearts { font-size: 28px; letter-spacing: 2px; filter: drop-shadow(1px 1px 0 #000); }
.dmg { position: absolute; font-size: 44px; font-weight: 900; color: #ffe14a; text-shadow: 3px 3px 0 #a40000; animation: dmg .8s forwards; pointer-events: none; z-index: 30; }
@keyframes dmg { from { transform: translateY(0) scale(.6); opacity: 1; } to { transform: translateY(-70px) scale(1.2); opacity: 0; } }
.flash { position: fixed; inset: 0; background: rgba(255,0,0,.35); pointer-events: none; animation: flashA .4s forwards; z-index: 40; }
@keyframes flashA { from { opacity: 1; } to { opacity: 0; } }
.count3 { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--brush); font-size: 160px; color: #fff; text-shadow: 0 0 30px #ff9a00, 6px 6px 0 #000; z-index: 60; pointer-events: none; background: rgba(0,0,0,.25); }
.count3 b { animation: zoom .5s; }

/* 二人修行（向かい合って同時に） */
#duel .half { position: absolute; left: 0; right: 0; height: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px 12px; }
#duel .half.top { top: 0; transform: rotate(180deg); }
#duel .half.bot { bottom: 0; }
#duel .half.red { background: linear-gradient(180deg, rgba(200,16,46,.35), rgba(200,16,46,.1)); }
#duel .half.blue { background: linear-gradient(180deg, rgba(42,111,201,.35), rgba(42,111,201,.1)); }
#duel .mid { position: absolute; left: 0; right: 0; top: 50%; height: 6px; margin-top: -3px; background: linear-gradient(90deg, #c8102e, #ffd76a, #2a6fc9); z-index: 5; }
#duel .who { color: #fff; font-weight: 900; font-size: 18px; text-shadow: 1px 1px 0 #000; display: flex; align-items: center; gap: 8px; width: 100%; max-width: 560px; }
#duel .who img { width: 40px; }
#duel .qtext { font-size: clamp(30px, 6vh, 56px); }
#duel .qbox { padding: 4px 10px; max-width: 560px; }
#duel .choices { max-width: 560px; gap: 6px; margin-top: 6px; }
#duel .choice { font-size: clamp(20px, 3.6vh, 32px); padding: 4px; }
#duel .freeze { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; font-size: 34px; font-weight: 900; color: #fff; background: rgba(120,0,0,.55); z-index: 10; text-shadow: 2px 2px 0 #000; }
#duel .half.frozen .freeze { display: flex; }
#duel .winbox { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 10px; z-index: 12; background: rgba(0,0,0,.45); }
#duel .winbox .w { font-family: var(--brush); font-size: 64px; color: #ffe14a; text-shadow: 4px 4px 0 #000; }
#duel .winbox .w.lose { color: #fff; font-size: 44px; }
#duel .duel-btns { position: absolute; z-index: 20; left: 50%; top: 50%; transform: translate(-50%, -50%); display: none; gap: 10px; }
#duel .quit { position: absolute; z-index: 20; right: 10px; top: 50%; transform: translateY(-50%); }

/* 結果（掛け軸） */
.kake { position: relative; max-width: 560px; margin: 10px auto 0; transform-origin: top center; animation: unroll .9s cubic-bezier(.2,.8,.2,1); }
@keyframes unroll { from { transform: scaleY(.05); } to { transform: scaleY(1); } }
.kake .rod { height: 20px; border-radius: 10px; background: linear-gradient(180deg, #8b5a2b, #3b1f08); margin: 0 -14px; box-shadow: 0 4px 8px rgba(0,0,0,.4); position: relative; z-index: 2; }
.kake .cloth { background: linear-gradient(180deg, #2f4f3a, #1f3828); padding: 14px 18px; }
.kake .sheet { background: var(--paper); border: 2px solid #c9a76a; padding: 18px 16px; text-align: center; }
.r-title { font-family: var(--brush); font-size: clamp(52px, 11vw, 80px); line-height: 1.1; }
.r-title.pass { color: var(--red); }
.r-title.fail { color: #345; font-size: clamp(40px, 9vw, 60px); }
.r-line { font-size: 22px; font-weight: 900; margin-top: 8px; }
.r-sub { font-size: 16px; font-weight: 800; color: #6b4a2a; margin-top: 4px; }
.r-new { display: inline-block; margin-top: 8px; background: var(--red); color: #fff; font-weight: 900; padding: 4px 14px; border-radius: 99px; font-size: 20px; animation: pulse 1s infinite; }
.r-get { margin-top: 12px; padding: 10px; border: 3px double #b0761e; border-radius: 12px; background: #fff3d0; font-weight: 900; font-size: 18px; }
.r-miss { margin-top: 10px; font-size: 16px; font-weight: 800; text-align: left; background: #fff; border-radius: 10px; padding: 8px 12px; border: 2px solid #e6d6b4; }
.hanko { position: absolute; right: 16px; top: 28px; width: 92px; height: 92px; border: 5px solid var(--red); border-radius: 50%; color: var(--red); font-family: var(--brush); font-size: 30px; display: flex; align-items: center; justify-content: center; transform: rotate(-14deg); animation: hanko .5s .9s both; background: rgba(255,255,255,.5); z-index: 3; }
@keyframes hanko { from { transform: rotate(-14deg) scale(3); opacity: 0; } to { transform: rotate(-14deg) scale(1); opacity: 1; } }
.r-btns { display: flex; gap: 12px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }
.w-btn { background: linear-gradient(180deg, var(--wood-l), var(--wood) 60%, var(--wood-d)); color: #fff; font-size: 20px; font-weight: 900; padding: 12px 22px; border-radius: 14px; border: 3px solid #2e1a08; box-shadow: 0 5px 0 #2e1a08; }
.w-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #2e1a08; }
.w-btn.red { background: linear-gradient(180deg, #ff6d5a, #c8102e 60%, #7a0010); border-color: #4a0008; box-shadow: 0 5px 0 #4a0008; }
.r-sensei { display: flex; justify-content: center; margin-top: 14px; }

/* 帯が上がった */
#beltUp { position: fixed; inset: 0; z-index: 90; display: none; align-items: center; justify-content: center; flex-direction: column; background: radial-gradient(circle, rgba(255,214,90,.55), rgba(30,15,0,.92) 70%); }
#beltUp.show { display: flex; }
#beltUp .rays { position: absolute; width: 900px; height: 900px; background: repeating-conic-gradient(rgba(255,230,140,.25) 0 10deg, transparent 10deg 20deg); animation: spinR 12s linear infinite; pointer-events: none; }
@keyframes spinR { to { transform: rotate(360deg); } }
#beltUp img { position: relative; width: clamp(160px, 30vw, 240px); animation: pop .6s; }
#beltUp .bt { position: relative; font-family: var(--brush); color: #fff; font-size: clamp(40px, 8vw, 64px); text-shadow: 4px 4px 0 #000; }
#beltUp .bb { position: relative; width: 260px; height: 34px; border-radius: 8px; border: 3px solid rgba(0,0,0,.4); margin: 10px 0; animation: tie 1s ease; }
@keyframes tie { from { width: 0; } to { width: 260px; } }
#beltUp .bs { position: relative; color: #ffe9b0; font-weight: 900; font-size: 20px; margin-bottom: 14px; text-align: center; }

/* 九九表 */
.kt { display: grid; grid-template-columns: 64px repeat(9, 1fr); gap: 4px; }
.kt div { text-align: center; border-radius: 8px; font-weight: 900; padding: 6px 0; font-size: clamp(12px, 2.2vw, 17px); }
.kt .h { background: var(--wood); color: #fff; font-family: var(--brush); font-size: 18px; }
.kt .c { background: #e9dcc0; color: #b3a07c; }
.kt .c.lit { background: #cfe9ff; color: #1e4f8a; }
.kt .c.gold { background: linear-gradient(180deg, #ffe885, #e8b923); color: #6b3a00; box-shadow: 0 0 8px rgba(255,190,40,.8); }
.kt .c.nig { outline: 3px solid var(--red); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-weight: 800; font-size: 15px; margin-top: 10px; }
.legend span i { display: inline-block; width: 18px; height: 14px; border-radius: 4px; vertical-align: middle; margin-right: 4px; }

/* 巻物棚 */
.shelf { display: grid; grid-template-columns: 80px repeat(5, 1fr); gap: 6px; align-items: center; }
.shelf .h { font-weight: 900; font-size: 13px; text-align: center; color: #6b4a2a; }
.shelf .dn { font-family: var(--brush); font-size: 20px; text-align: center; background: var(--wood); color: #fff; border-radius: 8px; padding: 2px 0; }
.shelf .cell { text-align: center; padding: 6px 0; background: linear-gradient(180deg, #8b5a2b, #5e3613); border-radius: 6px; box-shadow: inset 0 -4px 0 rgba(0,0,0,.35); }
.ladder { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 4px; }
.ladder .st { text-align: center; font-size: 12px; font-weight: 900; padding: 6px 6px; border-radius: 10px; background: #f3e6c8; min-width: 70px; }
.ladder .st.now { background: #fff3c4; box-shadow: 0 0 0 3px var(--gold); }
.ladder .st.off { opacity: .45; }
.badges { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.badge { text-align: center; background: #f3e6c8; border-radius: 14px; padding: 8px 4px; font-weight: 900; font-size: 14px; }
.badge img { width: 80%; max-width: 110px; }
.badge.off img { filter: grayscale(1) brightness(.4); }
.sec-t { font-size: 20px; font-weight: 900; margin: 16px 0 8px; border-left: 8px solid var(--red); padding-left: 10px; }

/* 桜・きらきら */
.petal { position: fixed; top: -30px; width: 16px; height: 12px; background: #ffc4d6; border-radius: 12px 0 12px 0; z-index: 80; pointer-events: none; animation: fall linear forwards; opacity: .95; }
@keyframes fall { to { transform: translate(var(--dx), 110vh) rotate(var(--rot)); } }

/* モーダル */
.modal { position: fixed; inset: 0; z-index: 100; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.6); padding: 16px; }
.modal.active { display: flex; }
.modal .panel { width: 100%; max-width: 460px; max-height: 92vh; overflow-y: auto; }
.modal h3 { font-size: 22px; font-weight: 900; text-align: center; margin-bottom: 10px; }
.pin-dots { display: flex; justify-content: center; gap: 12px; margin: 10px 0 14px; }
.pin-dots i { width: 20px; height: 20px; border-radius: 50%; border: 3px solid var(--wood); }
.pin-dots i.on { background: var(--wood); }
.pin-dots.bad { animation: shake .4s; }
.pin-pad { display: grid; grid-template-columns: repeat(3, 72px); gap: 12px; justify-content: center; }
.pin-pad button { width: 72px; height: 72px; border-radius: 50%; background: #fff; border: 3px solid var(--wood); font-size: 28px; font-weight: 900; box-shadow: 0 4px 0 var(--wood-d); }
.pin-pad button:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--wood-d); }
.pin-pad button.sm { font-size: 16px; }
.pin-msg { text-align: center; color: var(--red); font-weight: 800; min-height: 22px; margin-top: 6px; }
.row-btns { display: flex; gap: 10px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
.t-sec { margin-top: 14px; padding-top: 10px; border-top: 2px dashed #d8c39a; }
.t-sec h4 { font-size: 17px; font-weight: 900; margin-bottom: 8px; }
.t-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.t-stat { background: #fff; border: 2px solid #e6d6b4; border-radius: 10px; padding: 8px; text-align: center; font-weight: 800; }
.t-stat b { display: block; font-size: 26px; }
.t-table { width: 100%; border-collapse: collapse; font-size: 14px; font-weight: 800; }
.t-table th, .t-table td { border: 1px solid #e6d6b4; padding: 4px; text-align: center; }
.t-table th { background: #f3e6c8; }
.t-check { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; }
.t-check label, .t-opt { display: flex; align-items: center; gap: 6px; font-weight: 800; background: #fff; border: 2px solid #e6d6b4; border-radius: 10px; padding: 6px 8px; }
.t-check input, .t-opt input { width: 20px; height: 20px; }
.t-name { width: 100%; font-size: 18px; padding: 8px; border: 2px solid #c9a76a; border-radius: 10px; font-family: inherit; }
.t-note { font-size: 13px; font-weight: 800; color: #6b4a2a; margin-top: 4px; line-height: 1.5; }
.g-btn { background: #eee; border: 2px solid #bbb; border-radius: 10px; padding: 10px 16px; font-weight: 800; font-size: 16px; }
.p-btn { background: var(--green); color: #fff; border-radius: 10px; padding: 10px 18px; font-weight: 900; font-size: 17px; box-shadow: 0 4px 0 #145c32; }
.d-btn { background: #fff; color: var(--red); border: 2px solid var(--red); border-radius: 10px; padding: 8px 14px; font-weight: 800; font-size: 15px; }
.x-share { display: block; width: 100%; margin-top: 10px; background: #f2f2f2; color: #555; border: 1px solid #ccc; border-radius: 10px; padding: 8px; font-size: 14px; font-weight: 800; }
.x-tpl { display: block; width: 100%; text-align: left; background: #fff; border: 2px solid #e6d6b4; border-radius: 10px; padding: 10px; margin-top: 8px; font-size: 15px; font-weight: 800; line-height: 1.5; }
#xCard { position: fixed; right: 12px; bottom: 12px; z-index: 120; max-width: 300px; display: none; background: #fff; border: 2px solid #ccc; border-radius: 14px; padding: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.3); font-weight: 800; font-size: 14px; }
#xCard.show { display: block; }
#xCard .row-btns button { font-size: 13px; padding: 6px 10px; }
#busy { position: fixed; inset: 0; z-index: 200; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 14px; background: rgba(30,15,0,.65); color: #fff; font-weight: 900; font-size: 20px; }
#busy.active { display: flex; }
#toast { position: fixed; left: 50%; top: 18%; transform: translateX(-50%); z-index: 150; background: rgba(43,26,14,.92); color: #fff; font-weight: 900; font-size: 22px; padding: 12px 24px; border-radius: 16px; border: 3px solid #ffd76a; display: none; text-align: center; max-width: 90vw; }
#toast.show { display: block; animation: pop .3s; }
.test-ribbon { position: fixed; left: 0; top: 0; z-index: 300; background: #6a1b9a; color: #fff; font-weight: 900; font-size: 13px; padding: 4px 12px; border-bottom-right-radius: 10px; display: none; }
.test-on .test-ribbon { display: block; }

@media (max-width: 560px) {
  .menu-top { grid-template-columns: 1fr; }
  .belt-card { justify-self: start; }
  .dan-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .dan-btn { min-height: 96px; padding: 10px 4px; }
  .dan-btn .n { font-size: 30px; }
  .shelf { grid-template-columns: 52px repeat(5, 1fr); }
  .shelf .h { font-size: 11px; }
  .kt { grid-template-columns: 40px repeat(9, 1fr); gap: 2px; }
  .kt div { font-size: 11px; padding: 5px 0; }
  .badges { grid-template-columns: repeat(2, 1fr); }
  .hanko { width: 70px; height: 70px; font-size: 22px; right: 6px; }
  .stage { min-height: 90px; }
  #xCard { left: 12px; right: 12px; top: 12px; bottom: auto; max-width: none; }
  .t-mode { grid-template-columns: 1fr; }
  .pin-pad { grid-template-columns: repeat(3, 64px); }
  .pin-pad button { width: 64px; height: 64px; }
}
@media (max-height: 640px) {
  .stage { min-height: 70px; }
  .stage .sensei img { width: 70px; }
  .choice { padding: 6px 4px; }
}
/* 2026-11-25 縦が短い画面（Googleの帯つき・iPad横・ノートPC）で、札やキーのいちばん下の段が画面の外に切れていた。
   札とキーは のこりの高さに おさまるように ちぢめる。それでも入らないときは 画面をスクロールできる */
.play-wrap { overflow-y: auto; }
.stage { flex-shrink: 0; margin: clamp(4px, 2vh, 16px) 0 clamp(2px, .8vh, 6px); min-height: clamp(56px, 14vh, 110px); }
.stage .sensei img { width: clamp(52px, min(15vw, 15vh), 130px); }
.qbox { flex-shrink: 0; padding: clamp(4px, 1.2vh, 10px) 14px; }
.qtext { font-size: clamp(30px, min(9vw, 9.5vh), 76px); }
#play .choices, #play .keypad { flex: 0 1 auto; min-height: 0; margin-top: clamp(6px, 1.6vh, 12px); gap: clamp(6px, 1.4vh, 10px); }
#play .choices { grid-template-rows: repeat(3, minmax(0, 1fr)); }
#play .keypad { grid-template-rows: repeat(4, minmax(0, 1fr)); }
#play .choice { min-height: 0; font-size: clamp(20px, min(5.5vw, 6vh), 40px); padding: clamp(2px, 1.2vh, 10px) 4px; }
#play .choice.small { font-size: clamp(16px, min(4.4vw, 4.8vh), 30px); }
#play .key { aspect-ratio: auto; min-height: 0; padding: clamp(2px, 1.6vh, 14px) 0; font-size: clamp(22px, 5vh, 34px); }
#play .key.go { font-size: clamp(16px, 3.6vh, 24px); }
/* スマホ幅の師範戦：吹き出しが縦に細くつぶれ、札が画面の下へ押し出されていた */
.quit { white-space: nowrap; }
@media (max-width: 560px) {
  .timer { font-size: 18px; min-width: 0; padding: 4px 8px; }
  .stage .sensei { flex: 1 1 auto; min-width: 0; }
  .stage .bubble { flex: 1 1 auto; min-width: 0; }
  .boss-zone { flex-shrink: 0; }
  .boss-zone img { height: clamp(64px, 15vh, 130px); max-width: 30vw; }
  .boss-name { font-size: 14px; }
  .hp { width: 100px; height: 14px; }
  .hearts { font-size: 20px; }
}
</style>
</head>
<body>
<div class="test-ribbon">テストプレイヤーで試し中（記録は残りません）</div>

<div id="loading" class="screen active">

function ac() {

}

function judge(ok, q) {

  if (ok) {
    G.correct++; G.combo++; G.maxCombo = Math.max(G.maxCombo, G.combo);
    cellKeys.forEach(function (k) { P.cells[k] = (P.cells[k] || 0) + 1; });
    cellKeys.forEach(function (k) {
      if (P.nigate[k]) {
        P.nigate[k]--;
        if (P.nigate[k] <= 0) { delete P.nigate[k]; toast('にがて札「' + k.replace('x', '×') + '」をやぶった！'); petals(18); }
      }
    });
    sOk();
    var c = $('pCombo');

    else { c.textContent = ''; c.className = 'combo'; }
    if (G.combo > 0 && G.combo % 5 === 0) petals(24);

  } else {
    G.combo = 0;
    $('pCombo').textContent = '';

    sNg();
    var qb = $('pQbox'); qb.classList.remove('shake'); void qb.offsetWidth; qb.classList.add('shake');

    setSensei(4, pick(CHEER) + '<br><b style="color:#c8102e;font-size:1.15em">' + full + '</b>');
    if (G.kind === 'boss') bossAttack();

}

}

function chk(name, val, label, on) {
  return '<label><input type="checkbox" data-g="' + name + '" value="' + val + '"' + (on ? ' checked' : '') + '>' + label + '</label>';
}
function paintSettings(isNew) {
  var t = S.teacher, s = t.settings, h = '';
  h += '<h3>' + (isNew ? 'クラスの指定を決める' : '先生の部屋 ・ クラス ' + t.code) + '</h3>';
  if (!isNew) h += shareBox(t) + '<div id="tStats"></div>';
  h += '<div class="t-sec"><h4>道場の名前（トップに出ます・30字まで）</h4><input class="t-name" id="tName" maxlength="30" placeholder="例：6年1組" value="' + esc(s.name) + '"></div>';
  h += '<div class="t-sec"><h4>指定のしかた</h4><div class="t-mode">';
  h += '<label><input type="radio" name="tMode" value="only"' + (s.mode !== 'recommend' ? ' checked' : '') + '><b>指定だけ</b><span>選んだ物だけ遊べる（ほかは灰色）</span></label>';
  h += '<label><input type="radio" name="tMode" value="recommend"' + (s.mode === 'recommend' ? ' checked' : '') + '><b>おすすめ</b><span>選んだ物が光って先頭に。ほかも遊べる</span></label>';
  h += '</div><div class="t-note">何も選ばない項目は「全部」になります。全部の項目を空にすると、自由に遊べます。</div></div>';
  h += '<div class="t-sec"><h4>段</h4><div class="t-check">';
  for (var d = 2; d <= 9; d++) h += chk('dans', d, d + 'の段', s.dans.indexOf(d) >= 0);
  h += '</div></div><div class="t-sec"><h4>コース</h4><div class="t-check wide">';
  COURSES.forEach(function (c) { h += chk('courses', c.id, c.name, s.courses.indexOf(c.id) >= 0); });
  h += '</div></div><div class="t-sec"><h4>修行の種類</h4><div class="t-check wide">';
  Object.keys(KIND_NAMES).forEach(function (k) { h += chk('kinds', k, KIND_NAMES[k], s.kinds.indexOf(k) >= 0); });
  h += '</div></div>';
  h += '<div class="row-btns">';
  if (isNew) h += '<button class="p-btn" onclick="saveSettings(true)">この指定で クラスコードを作る</button><button class="g-btn" onclick="logoutTeacher()">やめる</button>';
  else h += '<button class="p-btn" onclick="saveSettings(false)">保存する</button><button class="g-btn" onclick="logoutTeacher()">保存せずに子どもの画面へ</button>';
  h += '</div>';
  if (!isNew && S.cls && S.cls.code === t.code) {
    h += '<div class="t-sec"><h4>この端末</h4><label class="t-opt"><input type="checkbox" id="tTest"' + (S.test ? ' checked' : '') + ' onchange="setTest(this.checked);paintDojoName()">この端末を「テストプレイヤー」にする（集計に入りません）</label>';
    h += '<button class="g-btn" style="margin-top:8px" onclick="leaveHere()">この端末をクラスから外す</button></div>';
  }
  if (!isNew) h += '<div class="t-sec"><button class="d-btn" onclick="askReset()">このクラスの集計を消す</button><div class="t-note">子どもの端末の巻物・帯は消えません。</div></div>';
  h += '<button class="x-share" onclick="openX()">📣 感想をXでシェア</button>';
  $('teacherIn').innerHTML = h;
  $('teacherModal').classList.add('active');
  $('teacherModal').scrollTop = 0;
  if (!isNew) paintStats(t.stats, t.misses, 'このクラス');
}
function readSettings() {
  var s = { name: $('tName').value.trim().slice(0, 30), mode: 'only', dans: [], courses: [], kinds: [] };
  var m = document.querySelector('input[name=tMode]:checked');
  if (m) s.mode = m.value;
  var cs = $('teacherIn').querySelectorAll('input[type=checkbox][data-g]');
  for (var i = 0; i < cs.length; i++) {
    if (!cs[i].checked) continue;
    var g = cs[i].getAttribute('data-g');
    s[g].push(g === 'dans' ? Number(cs[i].value) : cs[i].value);
  }
  return s;
}
var saving = false;
function saveSettings(isNew) {
  if (saving) return;
  var t = S.teacher, s = readSettings();
  saving = true;
  if (isNew) {
    call('createClass', [t.pass, s], function (r) {
      saving = false;
      t.code = r.code; t.url = r.url; t.qr = r.qr; t.settings = s;
      paintCreated();
      S.xAfter = true;
    }, function (e) { saving = false; toast(errText(e), 2500); }, 'クラスコードを作っています…');
  } else {
    call('saveClass', [t.code, t.pass, s], function () {
      saving = false;
      t.settings = s;
      if (S.cls && S.cls.code === t.code) { var c = JSON.parse(JSON.stringify(s)); c.code = t.code; setClass(c); }
      S.xAfter = true;
      logoutTeacher();
      toast('保存しました。子どもの端末は、次にひらいたときから変わります', 3000);
    }, function (e) { saving = false; toast(errText(e), 2500); }, '保存しています…');
  }
}
function linkOf(t) { return (t.url || '') + '?dojo=' + t.code; }
function shareBox(t) {
  var h = '<div class="share">';
  h += '<div class="share-code"><span>クラスコード</span><b>' + t.code + '</b></div>';
  if (t.qr) h += '<div class="share-qr">' + t.qr + '</div>';
  h += '<div class="share-link"><input id="shareUrl" readonly value="' + esc(linkOf(t)) + '" onclick="this.select()"><button class="g-btn" onclick="copyLink()">コピー</button></div>';
  h += '<div class="t-note">このリンクかQRから開くと、その端末にクラスコードが入ります。トップの「先生のコード」に6けたを入れても同じです。</div>';
  if (!S.cls || S.cls.code !== t.code) h += '<button class="g-btn" style="margin-top:8px" onclick="joinHere()">この端末にも このコードを入れる</button>';
  h += '</div>';
  return h;
}
function paintCreated() {
  var t = S.teacher;
  var h = '<h3>クラスコードができました</h3>' + shareBox(t);
  h += '<div class="t-note" style="margin-top:8px">合言葉は どこにも表示されません。忘れないように控えてください。このクラスに入った端末には「先生」ボタンが出ません。指定を変えるときは、右上の「クラス」の番号をタップして合言葉を入れてください（ほかの端末なら「先生」→「指定を変える」）。</div>';
  h += '<div class="row-btns"><button class="p-btn" onclick="logoutTeacher()">子どもの画面へ</button></div>';
  $('teacherIn').innerHTML = h;
  $('teacherModal').scrollTop = 0;
  sFan(); petals(30);
}
function copyLink() {
  var el = $('shareUrl'), v = el.value;
  function fallback() { el.focus(); el.select(); try { document.execCommand('copy'); toast('コピーしました'); } catch (e) { toast('選ばれた文字をコピーしてください', 2500); } }
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(v).then(function () { toast('コピーしました'); }, fallback);
    else fallback();
  } catch (e) { fallback(); }
}
function joinHere() {
  var t = S.teacher;
  $('teacherModal').classList.remove('active');
  needSwitchPass(t.code, function () {
    var c = JSON.parse(JSON.stringify(t.settings));
    c.code = t.code; setClass(c); paintDojoName();
    $('teacherModal').classList.add('active');
    toast('この端末にクラス ' + t.code + ' を入れました');
    var b = $('teacherIn').querySelector('.share .g-btn[onclick="joinHere()"]');
    if (b) b.remove();
  }, function () { $('teacherModal').classList.add('active'); });
}
function paintStats(s, miss, label) {
  s = s || { totalPlays: 0, playsByDan: {} };
  miss = miss || {};
  var h = '<div class="t-sec"><h4>' + label + 'の集計</h4><div class="t-stats"><div class="t-stat">修行した回数<b>' + (s.totalPlays || 0) + '</b></div><div class="t-stat">さいごに修行した日<b style="font-size:18px">' + (s.lastAccessDate ? new Date(s.lastAccessDate).toLocaleDateString('ja-JP') : '-') + '</b></div></div>';
  var top = Object.keys(miss).sort(function (a, b) { return miss[b] - miss[a]; }).slice(0, 5);
  h += '<h4 style="margin-top:10px">よくまちがえる式 トップ5</h4>';
  if (top.length) {
    h += '<table class="t-table"><tr><th>順位</th><th>式</th><th>まちがえた数</th></tr>';
    top.forEach(function (k, i) { var a = k.split('x'); h += '<tr><td>' + (i + 1) + '</td><td>' + a[0] + '×' + a[1] + '＝' + (a[0] * a[1]) + '</td><td>' + miss[k] + '</td></tr>'; });
    h += '</table>';
  } else h += '<div class="t-note">まだ記録がありません</div>';
  h += '<h4 style="margin-top:10px">段ごとの記録</h4><table class="t-table"><tr><th>段</th><th>回数</th><th>合格率</th><th>正答率</th><th>さいこう</th></tr>';
  var pd = s.playsByDan || {}, ks = Object.keys(pd).sort();
  if (!ks.length) h += '<tr><td colspan="5">まだ記録がありません</td></tr>';
  ks.forEach(function (d) {
    var x = pd[d];
    h += '<tr><td>' + (d === 'all' ? '全' : esc(d)) + '</td><td>' + x.plays + '</td><td>' + (x.plays ? Math.round(x.successes / x.plays * 100) : 0) + '%</td><td>' + (x.qTotal ? Math.round(x.qCorrect / x.qTotal * 100) + '%' : '-') + '</td><td>' + (x.bestTime ? Number(x.bestTime).toFixed(1) + '秒' : '-') + '</td></tr>';
  });
  h += '</table><div class="t-note">合格率＝一人修行・にがて修行で10問全部正解した割合。正答率＝問題1問ずつの正解の割合（百人組手・師範も入る）。名前は記録していません。</div></div>';
  $('tStats').innerHTML = h;
}
function askReset() {
  var t = S.teacher;
  $('teacherModal').classList.remove('active');
  confirmBox('集計を消しますか？', 'クラス ' + t.code + ' の回数・正答率・まちがえた式が消えます。<br>もとに戻せません。', '消す', 'やめる', function (ok) {
    $('teacherModal').classList.add('active');
    if (!ok) return;
    call('resetClassStats', [t.code, t.pass], function () {
      t.stats = null; t.misses = null; paintStats(null, null, 'このクラス'); toast('消しました');
    }, function (e) { toast(errText(e), 2500); }, '消しています…');
  });
}
function startAdmin() {
  $('teacherModal').classList.remove('active');
  numDialog({
    title: '管理者の合言葉', sub: '全国の合計を見ます', min: 4, max: 8,
    onCancel: function () { $('teacherModal').classList.add('active'); },
    onOk: function (v, retry, done) {
      call('getAllStats', [v], function (r) {
        done();
        $('teacherIn').innerHTML = '<h3>全国の合計</h3><div class="t-stat">クラスコードの数<b>' + r.classes + '</b></div><div id="tStats"></div><div class="row-btns"><button class="g-btn" onclick="logoutTeacher()">子どもの画面へもどる</button></div>';
        $('teacherModal').classList.add('active');
        paintStats(r.stats, r.misses, '全国');
      }, function (e) { retry(errText(e)); }, 'たしかめています…');
    }
  });
}
function setTest(on) {
  S.test = !!on;
  try { if (S.test) localStorage.setItem('kuku_dojo_test', '1'); else localStorage.removeItem('kuku_dojo_test'); } catch (e) {}
  document.body.classList.toggle('test-on', S.test);
  loadProf();
}
function logoutTeacher() {
  S.teacher = null;
  $('teacherModal').classList.remove('active');
  stopAll();
  paintDojoName();
  show('home');
  if (S.xAfter) { S.xAfter = false; setTimeout(showXCard, 1200); }
}

/* ---------- Xで感想（先生側だけ） ---------- */
var X_URL = 'https:' + '/' + '/twitter.com/intent/tweet?text=';
var X_TAIL = ' @rohimotoiwaka #GASアプリで学校をHappyに';
var X_TPL = [
  '九九道場を使ってみました！おすすめです👍',
  '九九道場で、子どもたちが帯と巻物を集めながら九九の修行中です🥋',
  '九九道場の「師範に挑む」で、教室が大盛り上がりでした！'
];
var xOpening = false;
function openX() {
  var h = '';
  X_TPL.forEach(function (t, i) { h += '<button class="x-tpl" onclick="goX(' + i + ')">' + esc(t + X_TAIL) + '</button>'; });
  $('xList').innerHTML = h;
  $('xModal').classList.add('active');
}
function closeX() { $('xModal').classList.remove('active'); }
function goX(i) {
  if (xOpening) return;
  xOpening = true;
  setTimeout(function () { xOpening = false; }, 1500);
  window.open(X_URL + encodeURIComponent(X_TPL[i] + X_TAIL), '_blank');
  closeX();
}
var xCardT = null;
function showXCard() {
  try { if (localStorage.getItem('kuku_dojo_xcard_off') === '1') return; } catch (e) {}
  $('xCard').classList.add('show');
  clearTimeout(xCardT);
  xCardT = setTimeout(hideXCard, 15000);
}
function hideXCard() { $('xCard').classList.remove('show'); }
function xCardNever() { try { localStorage.setItem('kuku_dojo_xcard_off', '1'); } catch (e) {} hideXCard(); }

(function () {
  try { if (localStorage.getItem('kuku_dojo_test') === '1') { S.test = true; document.addEventListener('DOMContentLoaded', function () { document.body.classList.add('test-on'); loadProf(); }); } } catch (e) {}
})();
